```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Dog Image | 4spurkee_</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="container">
                <h1>4spurkee_</h1>
                <nav>
                    <ul>
                        <li><a href="about.html">About me</a></li>
                        <li><a href="https://4spurkee.github.io/index.html">Go back</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>
            <section class="project">
                <div class="project-title">
                    <h2>Random Dog Image</h2>
                </div>

                <div class="image-container">
                    <img
                        id="dogImage"
                        src="https://images.dog.ceo/breeds/retriever-golden/n02099601_100.jpg"
                        alt="Random Dog"
                    />
                </div>

                <div class="form-wrapper">
                    <button onclick="fetchDogImage()">Get New Dog</button>
                    <button onclick="toggleAutoClicker()">AutoClicker</button>
                </div>
            </section>
        </main>

        <footer>
            <div class="container">
                <p>4spurkee_</p>
                <p>© 2025. All rights NOT reserved.</p>
            </div>
        </footer>
    </div>

    <audio id="dogSound" src="meowrgh.mp3" preload="auto"></audio>

    <script>
        let autoClickerInterval = null;

        function fetchDogImage() {
            fetch('https://dog.ceo/api/breeds/image/random')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch dog image');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status !== 'success') {
                        throw new Error('Dog image unavailable');
                    }

                    const dogImg = document.getElementById('dogImage');
                    dogImg.src = data.message;
                })
                .catch(err => console.error('Error fetching dog image:', err));
        }

        window.onload = () => {
            fetchDogImage();

            const dogImage = document.getElementById('dogImage');
            const dogSound = document.getElementById('dogSound');

            dogImage.addEventListener('click', () => {
                dogSound.currentTime = 0;
                dogSound.play();
            });
        };

        function toggleAutoClicker() {
            if (autoClickerInterval) {
                clearInterval(autoClickerInterval);
                autoClickerInterval = null;
            } else {
                autoClickerInterval = setInterval(fetchDogImage, 2000);
            }
        }
    </script>
</body>
</html>
